<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Demos (privado)</title>
<meta name="theme-color" content="#F4F5F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
<script>
/* ADD A DEMO: copy the built index.html + cuidados.html into /demos/<handle>/,
   then add one line here. Nothing else to touch. */
var DEMOS = [
  { handle: "necr0lin333sss", name: "necr0lin333sss", instagram: "necr0lin333sss_" },
  { handle: "bricetattooer",  name: "bricetattooer",  instagram: "bricetattooer" },
  { handle: "naotis",         name: "nao.tis",        instagram: "nao.tis", care: "aftercare.html" },
  { handle: "hachasketch",    name: "hachasketch",    instagram: "hachasketch" }
];
</script>
<style>
:root{--paper:#F4F5F2;--white:#fff;--ink:#1F2229;--muted:#5B6170;--line:#DCDFE4;--cobalt:#1E3F8F;--cobalt-deep:#15306F;--cobalt-soft:#E7ECF7;--ochre:#A5701A;
--serif:"Young Serif",Georgia,"Times New Roman",serif;--sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.6 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--cobalt)}
:focus-visible{outline:3px solid var(--ochre);outline-offset:3px;border-radius:6px}
.wrap{max-width:46rem;margin:0 auto;padding:2rem 1.25rem 3rem}
h1{font:400 clamp(2rem,8vw,3rem)/1.1 var(--serif);margin:0 0 .5rem}
.sub{color:var(--muted);margin:0 0 2rem}
.cards{list-style:none;margin:0;padding:0;display:grid;gap:1rem}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:1.25rem}
.card h2{font:400 1.4rem/1.2 var(--serif);margin:0 0 .25rem;overflow-wrap:anywhere}
.card p{margin:0 0 1rem;color:var(--muted);font-size:.95rem}
.row{display:flex;flex-wrap:wrap;gap:.6rem}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:.5rem 1.1rem;border-radius:12px;font-weight:600;text-decoration:none;border:2px solid var(--cobalt)}
.btn.primary{background:var(--cobalt);color:#fff}
.btn.primary:hover{background:var(--cobalt-deep);border-color:var(--cobalt-deep)}
.btn.ghost{color:var(--cobalt)}
.btn.ghost:hover{background:var(--cobalt-soft)}
</style>
</head>
<body>
<main class="wrap">
  <h1>Demos</h1>
  <p class="sub">Privado. Para enseñar en el móvil. Sin enlaces desde la web pública.</p>
  <ul class="cards" id="cards"></ul>
  <noscript><p>Activa JavaScript para ver la lista.</p></noscript>
</main>
<script>
(function(){
  var ul=document.getElementById('cards');
  DEMOS.forEach(function(d){
    var li=document.createElement('li'); li.className='card';
    li.innerHTML='<h2></h2><p></p><div class="row"><a class="btn primary"></a><a class="btn ghost"></a></div>';
    li.querySelector('h2').textContent=d.name;
    li.querySelector('p').textContent='@'+d.instagram;
    var a=li.querySelectorAll('a');
    a[0].href='/demos/'+d.handle+'/'; a[0].textContent='Abrir demo';
    a[1].href='/demos/'+d.handle+'/'+(d.care||'cuidados.html'); a[1].textContent='Cuidados';
    ul.appendChild(li);
  });
})();
</script>
</body>
</html>
